<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mim</title><link rel="stylesheet" href="style.css"><script defer src="sources.js"></script><script defer src="app.js"></script></head><body><main><button id="expand-notch" class="notch" type="button" hidden aria-label="Open SOLO">SOLO <span>⌄</span></button><div class="window-actions" data-tauri-drag-region><button id="sessions-toggle" type="button">Sessions</button><button id="new-session" type="button">+ New chat</button><button id="settings-toggle" type="button">Settings</button><button id="collapse" type="button" title="Collapse" aria-label="Collapse">−</button><button id="close" aria-label="Close window">×</button></div><aside id="settings-panel" hidden><div class="session-head"><strong>API settings</strong><button id="settings-close" type="button" aria-label="Close settings">×</button></div><p>Keys are saved locally. Leave a field blank to keep its current value.</p><form id="api-settings"><label for="groq-key">Groq <span id="groq-status"></span></label><input id="groq-key" type="password" autocomplete="off" placeholder="Enter a new key"><label for="tavily-key">Tavily <span id="tavily-status"></span></label><input id="tavily-key" type="password" autocomplete="off" placeholder="Enter a new key"><label for="openrouter-key">OpenRouter backup <span id="openrouter-status"></span></label><input id="openrouter-key" type="password" autocomplete="off" placeholder="Optional"><button type="submit">Save keys</button><p id="settings-message" role="status"></p></form><p>Environment variables take precedence over saved keys.</p></aside><aside id="sessions-panel" hidden><div class="session-head"><strong>Sessions</strong><button id="sessions-close" type="button">×</button></div><label class="sr" for="session-search">Search sessions</label><input id="session-search" placeholder="Search conversations…"><div id="sessions-list"></div></aside><div id="messages" role="log" aria-live="polite"><div class="welcome"><div class="brand">SOLO</div><div>What can I help with?</div></div></div><div id="status" role="status"></div><aside id="evidence" hidden><div class="evidence-head"><strong>Sources</strong><button id="close-evidence" aria-label="Close sources">×</button></div><div id="source-list"></div></aside><form id="form"><label class="sr" for="input">Your question</label><textarea id="input" placeholder="Ask anything…" rows="2" maxlength="16000"></textarea><div class="actions"><span>Enter to send · Shift+Enter for a new line</span><button id="cancel" type="button" hidden>Stop</button><button id="send" type="submit">Send ↑</button></div></form></main></body></html>
