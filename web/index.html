<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLO</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#29231f;background:#f8f5f2}main{max-width:850px;margin:auto;height:100vh;display:flex;background:white}aside{width:220px;padding:20px;border-right:1px solid #eee;overflow:auto}section{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px}h1{font-size:20px;letter-spacing:.12em}h2{font-size:23px}.sessions button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.new,form button{border:0;border-radius:12px;background:#26211e;color:white;padding:10px 14px;cursor:pointer}#messages{flex:1;overflow:auto}.turn{padding:12px 0;border-bottom:1px solid #eee;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.turn p{margin:8px 0}.inspectable{cursor:pointer}.inspectable:hover{background:#faf6f2}.turn ul,.turn ol{padding-left:22px}.turn code{background:#f5f2ef;padding:2px}.role{font-size:11px;text-transform:uppercase;color:#a17f6e;font-weight:700}.source{display:block;color:#77513f;margin-top:5px;overflow-wrap:anywhere}form{display:flex;gap:10px;padding:12px;border:1px solid #ded8d4;border-radius:14px}textarea{resize:none;flex:1;min-width:0;border:0;outline:none;font:inherit}#status{min-height:22px;color:#8c6b58;font-size:12px}@media(max-width:600px){aside{width:125px;padding:10px}section{padding:14px}}</style><script defer src="/app.js"></script></head><body><main><aside><h1>SOLO</h1><button class="new" id="new">+ New chat</button><h3>Sessions</h3><input id="search-sessions" aria-label="Search sessions" placeholder="Search…" style="width:100%;padding:7px;border:1px solid #ddd;border-radius:8px"><div class="sessions" id="sessions"></div></aside><section><h2>What can I help with?</h2><div id="messages" role="log" aria-live="polite"></div><div id="status" role="status"></div><aside id="source-panel" hidden style="width:auto;border:1px solid #eee;border-radius:12px;max-height:35vh;overflow:auto"><button id="close-sources" type="button">Close sources</button><div id="source-detail"></div></aside><form id="form"><textarea id="input" aria-label="Your question" placeholder="Ask about anything, including earlier conversations…" rows="2" required></textarea><button id="send">Send ↑</button></form></section></main></body></html>
