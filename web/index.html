<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLO</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#29231f;background:white}main{max-width:850px;margin:auto;height:100vh;display:flex;position:relative}#sidebar{position:absolute;z-index:2;top:0;bottom:0;left:0;width:min(280px,85%);padding:20px;border-right:1px solid #eee;overflow:auto;background:white;box-shadow:5px 0 25px #0002}#sidebar[hidden],#source-panel[hidden]{display:none}section{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px}header{display:flex;align-items:center;gap:10px}h1{font-size:20px;letter-spacing:.12em;margin:0 auto 0 0}h2{font-size:23px}button{font:inherit;cursor:pointer}body.collapsed section,body.collapsed #sidebar{display:none}body.collapsed main{height:100vh;align-items:center;justify-content:center}#bubble{display:none;width:100%;height:100%;border:0;border-radius:18px;background:#26211e;color:white;font-weight:700;letter-spacing:.08em}body.collapsed #bubble{display:block}header button[hidden]{display:none}#close-window{border:0;padding:4px 8px;font-size:22px;color:#777}header h1{cursor:grab}header button,#close-sidebar{border:1px solid #ded8d4;background:white;border-radius:12px;padding:8px 12px}.sessions button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.new,form button{border:0;border-radius:12px;background:#26211e;color:white;padding:10px 14px}#messages{flex:1;overflow:auto;min-height:0}.turn{padding:12px 0;border-bottom:1px solid #eee;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.turn p{margin:8px 0}.inspectable{cursor:pointer}.inspectable:hover{background:#faf6f2}.turn ul,.turn ol{padding-left:22px}.turn code{background:#f5f2ef;padding:2px}.role{font-size:11px;text-transform:uppercase;color:#a17f6e;font-weight:700}.source{display:block;color:#77513f;margin-top:5px;overflow-wrap:anywhere}form{display:flex;gap:10px;padding:12px;border:1px solid #ded8d4;border-radius:14px}textarea{resize:none;flex:1;min-width:0;border:0;outline:none;font:inherit}#status{min-height:22px;color:#8c6b58;font-size:12px}#source-panel{border:1px solid #eee;border-radius:12px;max-height:35vh;overflow:auto;padding:10px}
.sidebar-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sidebar-heading h3{margin:0;font-size:19px}#close-sidebar{border:0;font-size:22px;padding:2px 8px;color:#777}.sessions{margin-top:14px}.sessions .session-row{display:flex;align-items:center;gap:3px;border-radius:10px;margin-bottom:4px}.sessions .session-row.active{background:#f5f1ee}.sessions .session-row:hover{background:#f8f6f4}.sessions .session-title{flex:1;min-width:0;background:transparent;font-size:14px}.sessions .session-action{flex:none;width:30px;padding:5px;background:transparent;text-align:center;color:#786d67;font-size:14px}.empty-sessions{color:#8b817b;font-size:13px;padding:10px 8px}dialog{width:min(340px,90vw);border:1px solid #eee;border-radius:16px;padding:22px;color:#29231f;box-shadow:0 12px 45px #0002}dialog::backdrop{background:#0005}dialog form{display:block;padding:0;border:0}dialog h3{margin:0 0 10px}dialog p{color:#6d625c;overflow-wrap:anywhere}dialog input{width:100%;padding:10px;border:1px solid #d9d2cd;border-radius:8px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog-actions button{border:1px solid #ded8d4;border-radius:9px;padding:8px 12px;background:white}.dialog-actions .confirm{background:#29231f;color:white}.dialog-actions .danger{background:#a52e2e;color:white}
</style><script defer src="/app.js"></script></head><body><main><button id="bubble" type="button" aria-label="Open SOLO">SOLO ⌄</button><aside id="sidebar" hidden><div class="sidebar-heading"><h3>Sessions</h3><button id="close-sidebar" type="button" aria-label="Close sessions">×</button></div><input id="search-sessions" aria-label="Search sessions" placeholder="Search conversations…" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px"><div class="sessions" id="sessions"></div></aside><section><header><h1 data-webview-drag-region="true">SOLO</h1><button id="collapse-window" type="button" aria-label="Collapse SOLO" hidden>−</button><button id="close-window" type="button" aria-label="Close SOLO" title="Close SOLO" hidden>×</button><button id="open-sidebar" type="button" aria-controls="sidebar" aria-expanded="false">Sessions</button><button class="new" id="new" type="button">+ New chat</button></header><h2>What can I help with?</h2><div id="messages" role="log" aria-live="polite"></div><div id="status" role="status"></div><aside id="source-panel" hidden><button id="close-sources" type="button">Close sources</button><div id="source-detail"></div></aside><form id="form"><textarea id="input" aria-label="Your question" placeholder="Ask anything…" rows="2" required></textarea><button id="send">Send ↑</button></form></section></main><dialog id="session-dialog" aria-labelledby="dialog-title"><form id="dialog-form" method="dialog"><h3 id="dialog-title"></h3><p id="dialog-description"></p><input id="dialog-input" aria-label="Session name" maxlength="120"><div class="dialog-actions"><button type="button" id="dialog-cancel">Cancel</button><button class="confirm" id="dialog-confirm" type="submit">Save</button></div></form></dialog></body></html>
